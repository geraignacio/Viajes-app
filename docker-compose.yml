# Desarrollo local: Postgres 16 + la app en modo dev con hot reload.
# En producción la app corre en Vercel y la BD en Supabase; esto es solo local.
#
#   cp .env.example .env      # completa AUTH_SECRET y credenciales de Google
#   docker compose up
#   → http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
      POSTGRES_DB: viajes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes -d viajes"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: node:22-alpine
    working_dir: /app
    # openssl lo necesita el motor de Prisma en Alpine.
    command: sh -c "apk add --no-cache openssl >/dev/null && npm ci && npx prisma migrate deploy && npm run dev -- -H 0.0.0.0"
    env_file: .env
    environment:
      # Dentro de la red de compose, ambas URLs apuntan al servicio db.
      DATABASE_URL: postgresql://viajes:viajes@db:5432/viajes
      DIRECT_URL: postgresql://viajes:viajes@db:5432/viajes
      AUTH_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  next_cache:
